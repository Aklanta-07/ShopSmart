# ===========================
# TEST DATABASE (H2 In-Memory)
# IMPORTANT: Isolated from production Oracle DB.
# create-drop is safe here — it only affects H2.
# ===========================
spring.datasource.url=jdbc:h2:mem:shopsmart_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=Oracle
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=5

# ===========================
# JPA / HIBERNATE (Test)
# ===========================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===========================
# SQL INIT (disabled - using @Sql on test classes instead)
# ===========================
# spring.sql.init.mode=always
# spring.sql.init.platform=h2
# spring.sql.init.encoding=UTF-8
# spring.sql.init.data-locations=classpath:data-h2.sql

# ===========================
# DISABLE FLYWAY IN TESTS
# ===========================
spring.flyway.enabled=false

# ===========================
# DISABLE SQL AUTO-INIT IN TESTS
# Prevents src/main/resources/data.sql (Oracle syntax) from
# being auto-executed against the H2 test database.
# Seed data is loaded via @Sql on each test class instead.
# ===========================
spring.sql.init.mode=never

# ===========================
# JWT (dummy secret for tests)
# ===========================
app.jwt.secret=test-secret-key-for-unit-tests-only-not-for-production
app.jwt.expiration=86400000

# ===========================
# LOGGING
# ===========================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.shopsmart=DEBUG